<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fbf6e9">
  <meta name="description" content="Game belajar doa sehari-hari yang ceria dan ramah anak.">
  <title>Tebak Doa — Belajar sambil bermain</title>
  <link rel="stylesheet" href="css/style.css">
  <script defer src="js/questions.js"></script>
  <script defer src="js/progress.js"></script>
  <script defer src="js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Lewati ke konten utama</a>
  <header class="topbar">
    <button class="brand" type="button" data-action="home" aria-label="Ke beranda">
      <img class="brand-logo" src="assets/images/logo/logo.svg" alt="" width="40" height="40">
      <span>Tebak Doa</span>
    </button>
    <div class="topbar-actions">
      <span class="points-pill" aria-label="Total poin"><span aria-hidden="true">★</span> <span id="header-points">0</span></span>
      <button class="icon-button" type="button" data-action="settings" aria-label="Buka pengaturan">⚙</button>
    </div>
  </header>
  <main id="main" tabindex="-1">
    <div id="app" aria-live="polite"></div>
  </main>
  <footer class="footer">
    <span>Belajar dengan gembira, satu doa setiap hari.</span>
    <button class="text-button" type="button" data-action="guide">Panduan</button>

</html>
